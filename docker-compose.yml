name: julnow

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: julnow
      POSTGRES_PASSWORD: julnow_dev_password
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, when the volume is first created
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U julnow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: